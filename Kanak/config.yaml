bot_detection:
  # Thresholds for bot scoring
  min_engagement_rate: 0.0001       # below this = suspicious
  max_engagement_rate: 0.80         # above this = bot-inflated
  follower_following_ratio_max: 0.01 # low ratio = likely bot follower
  account_age_days_min: 90          # younger = suspicious
  default_profile_image_penalty: 0.3
  no_bio_penalty: 0.2
  suspicious_comment_similarity_threshold: 0.85  # cosine sim for duplicate comments
  min_posts_for_analysis: 10

trending:
